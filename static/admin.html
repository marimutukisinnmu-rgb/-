<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - LAN Territory Battle</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 24px; background: #11151c; color: white; }
    main { max-width: 720px; margin: auto; }
    button { margin: 6px; padding: 12px 18px; font-size: 16px; cursor: pointer; }
    input { padding: 10px; font-size: 16px; width: min(100%, 420px); }
    .hidden { display: none; }
    #message { margin-top: 16px; min-height: 24px; }
  </style>
</head>
<body>
  <main>
    <h1>管理画面</h1>
    <section id="login">
      <p>パスワードを入力してください。</p>
      <input id="password" type="password" autocomplete="current-password">
      <button id="loginButton">ログイン</button>
    </section>
    <section id="controls" class="hidden">
      <h2>特殊ボタン</h2>
      <button data-special="rain">🌧️ 雨</button>
      <button data-special="blackButton">⬛ 全員強制整列</button>
      <button data-special="random">🎲 ボタンのランダム</button>
    </section>
    <div id="message"></div>
  </main>
  <script>
    const password = document.getElementById('password');
    const loginButton = document.getElementById('loginButton');
    const login = document.getElementById('login');
    const controls = document.getElementById('controls');
    const message = document.getElementById('message');

    async function loginAdmin() {
      const response = await fetch('/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: password.value })
      });
      const data = await response.json();
      if (!data.ok) {
        message.textContent = 'パスワードが違います。';
        return;
      }
      login.classList.add('hidden');
      controls.classList.remove('hidden');
      message.textContent = '管理者としてログインしました。';
    }

    loginButton.addEventListener('click', loginAdmin);
    password.addEventListener('keydown', e => { if (e.key === 'Enter') loginAdmin(); });

    controls.querySelectorAll('[data-special]').forEach(button => {
      button.addEventListener('click', async () => {
        const response = await fetch('/admin/action', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: button.dataset.special })
        });
        const data = await response.json();
        message.textContent = data.ok ? '発動しました。' : (data.message || '発動できませんでした。');
      });
    });
  </script>
</body>
</html>
