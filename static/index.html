<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAN Territory Battle</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="topbar">
    <div><strong>LAN Territory Battle</strong></div>
    <div id="status">接続中...</div>
  </div>
  <div id="weaponbar">
    <button data-weapon="potato">1 🥔</button>
    <button data-weapon="chicken">2 🐔</button>
    <button data-weapon="chair">3 🪑</button>
    <button data-weapon="sock">4 🧦</button>
    <button data-weapon="tinyBoom">5 🧨</button>
    <button data-weapon="ducks">6 🦆</button>
    <button data-weapon="mystery">7 ☢️</button>
    <button id="fire">💥 発射</button>
    <span id="weaponInfo">武器: 🥔 じゃがいも投げ　（1〜7で選択、Space長押しで連射）</span>
  </div>
  <div id="info"></div>
  <canvas id="game"></canvas>
  <div id="help">常時前進　A / ← = 左　D / → = 右　（押している間0.01秒ごとに15°）　武器: 1〜7 / Space　☢️ 謎のボタンだけ50秒クール</div>
  <script src="/static/game.js"></script>
</body>
</html>
